name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest -v

      - name: Compile Python
        run: python -m py_compile app.py generate_session.py gr_observer/*.py gr_observer/modules/*.py
